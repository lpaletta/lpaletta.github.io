<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Animation | Louis Paletta</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@exampledev/new.css@1/new.min.css">
    <link rel="stylesheet" href="https://fonts.xz.style/serve/inter.css">

    <style>
      nav a.active {
        font-weight: bold;
      }

      .gif-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
        margin: 2rem 0;
      }

      .gif-grid img {
        max-width: 100%;
        border-radius: 6px;
      }

      .gif-grid figure {
        text-align: center;
      }

      @media (max-width: 700px) {
        .gif-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Animation</h1>
      <p>Local decoder dynamics</p>

      <nav>
        <a href="index.html">About</a> &nbsp; &nbsp;
        <a href="research.html">Research</a> &nbsp; &nbsp;
        <a href="teaching.html">Teaching</a> &nbsp; &nbsp;
        <a href="animation.html" class="active">Animation</a>
      </nav>
    </header>

    <section>
      <p>
        Animations illustrating the dynamics of local and cellular automaton decoders
        used in my work on quantum error correction.
      </p>

      <div class="gif-grid">
        <figure>
          <img src="decoder1.gif" alt="Local decoder animation">
          <figcaption>
            Local decoder for the 1D repetition code.
          </figcaption>
        </figure>

        <figure>
          <img src="decoder2.gif" alt="Cellular automaton decoder animation">
          <figcaption>
            Cellular automaton decoder dynamics.
          </figcaption>
        </figure>
      </div>
    </section>
  </body>
</html>
